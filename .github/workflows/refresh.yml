name: Refresh FOMC data

on:
  # Runs automatically every day at 13:00 UTC (~9am ET)
  schedule:
    - cron: "0 13 * * *"

  # Lets you trigger a refresh manually from the Actions tab, any time
  workflow_dispatch: {}

# Allows the workflow to commit the updated data.json back to the repo
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run refresh script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/refresh_data.py

      - name: Commit updated data.json (if changed)
        run: |
          git config user.name "fomc-tracker-bot"
          git config user.email "actions@github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes to data.json — skipping commit."
          else
            git commit -m "Automated data refresh: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
